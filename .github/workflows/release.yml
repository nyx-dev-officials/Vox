name: Signed Release

# The release APK is built, minified, signed and published on GitHub's runners.
# Nothing here needs to run on the maintainer's machine, and no keystore or
# password ever lives in the repository — only in Actions secrets.

on:
  push:
    tags:
      - '2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 2.0.7) — must already exist'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          test -s app/keystore/release.keystore
          keytool -list -keystore app/keystore/release.keystore \
            -storepass "${{ secrets.STORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" > /dev/null
          echo "Keystore decoded and readable."

      - name: Build signed universal FOSS release (R8)
        env:
          KEYSTORE_FILE: app/keystore/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew :app:assembleUniversalFossRelease \
            -PgithubUpdater=true \
            --no-configuration-cache \
            --console=plain \
            --warning-mode summary \
            -x lint

      # Diagnostics only: the build already failed loudly if signing or R8 did.
      # A missing SDK tool on the runner must not block publishing a good APK.
      - name: Verify signature and contents
        run: |
          APK=app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk
          test -s "$APK" || { echo "APK missing: $APK" >&2; exit 1; }
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER=""
          if [ -n "$SDK" ] && [ -d "$SDK" ]; then
            APKSIGNER=$(find "$SDK" -name apksigner -type f 2>/dev/null | sort | tail -1)
          fi
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" || echo "apksigner reported an issue"
          else
            echo "apksigner not available on runner; signature check skipped."
          fi
          unzip -l "$APK" | grep 'classes.*\\.dex' | head -3 || echo "no dex entries listed"

      - name: Stage assets and manifest
        env:
          UPDATER_IMAGE_URL: ${{ vars.UPDATER_IMAGE_URL }}
        run: |
          VERSION=$(sed -n 's/^VERSION_MAJOR=//p' version.properties).$(sed -n 's/^VERSION_MINOR=//p' version.properties).$(sed -n 's/^VERSION_PATCH=//p' version.properties)
          test "${TAG}" = "$VERSION" || { echo "Tag $TAG does not match version.properties $VERSION" >&2; exit 1; }
          VERSION_CODE=$(python3 -c 'import sys; a,b,c=(int(v) for v in sys.argv[1].split(".")); print((a*10000+b*100+c)*10000+9999)' "$VERSION")
          cp app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk vox-universal-foss.apk
          cp app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk "vox-${TAG}.apk"
          IMAGE_ARGS=()
          if [ -n "${UPDATER_IMAGE_URL:-}" ]; then IMAGE_ARGS+=(--image "$UPDATER_IMAGE_URL"); fi
          python3 tools/publish_updater_metadata.py \
            --version "$VERSION" \
            --version-code "$VERSION_CODE" \
            --release-notes ".github/release-notes/${TAG}.md" \
            --output updater.json \
            "${IMAGE_ARGS[@]}" vox-universal-foss.apk
          ls -lh vox-universal-foss.apk "vox-${TAG}.apk" updater.json

      - name: Create release with notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/${TAG}.md"
          test -f "$NOTES" || { echo "Missing $NOTES" >&2; exit 1; }
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" --latest --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              --title "Vox $TAG" \
              --notes-file "$NOTES" \
              --latest \
              --repo "${{ github.repository }}"
          fi

      - name: Upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No updater.json here: the manifest lives in the repository, so the
          # release page stays APKs plus GitHub's own source archives.
          gh release upload "$TAG" vox-universal-foss.apk "vox-${TAG}.apk" \
            --repo "${{ github.repository }}" --clobber

      - name: Publish updater manifest to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp updater.json /tmp/vox-updater.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp /tmp/vox-updater.json updater.json
          if git diff --quiet -- updater.json; then
            echo "Manifest unchanged."
          else
            git add updater.json
            git commit -m "Publish updater manifest for $TAG"
            git push origin main
          fi
