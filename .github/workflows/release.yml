name: Signed Release

# Two lanes:
#   • workflow_dispatch → fast signed TEST build (arm64-v8a + armeabi-v7a, no R8,
#     Gradle cache reused). Artifacts only; nothing is published.
#   • tag push → full universal release with R8, published with notes and the
#     repo-hosted updater manifest.
#
# No keystore or password lives in the repository — only in Actions secrets.

on:
  push:
    tags:
      - '2.*'
  workflow_dispatch:
    inputs:
      label:
        description: 'Label for this test build'
        required: false
        default: 'test'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.label || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.label || github.ref_name }}
      IS_RELEASE: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle user home, dependency cache and build cache persist between runs.
      # This is what makes an intermediate build minutes instead of half an hour.
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          test -s app/keystore/release.keystore
          keytool -list -keystore app/keystore/release.keystore \
            -storepass "${{ secrets.STORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" > /dev/null
          echo "Keystore decoded and readable."

      # Test lane: both ARM ABIs, no R8 — older 32-bit devices stay supported and
      # the emulator-only x86 slices are not built at all.
      - name: Build signed test APKs (arm64 + arm32, no R8)
        if: env.IS_RELEASE != 'true'
        env:
          KEYSTORE_FILE: app/keystore/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew :app:assembleArm64FossRelease :app:assembleArm32FossRelease \
            -PgithubUpdater=true \
            --build-cache \
            --no-configuration-cache \
            --console=plain \
            --warning-mode summary \
            -x lint

      # Release lane: one universal APK, fully minified. Only for a real release.
      - name: Build signed universal release (R8)
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_FILE: app/keystore/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew :app:assembleUniversalFossRelease \
            -PgithubUpdater=true \
            -PfullR8=true \
            --build-cache \
            --no-configuration-cache \
            --console=plain \
            --warning-mode summary \
            -x lint

      - name: Collect test APKs
        if: env.IS_RELEASE != 'true'
        run: |
          mkdir -p out
          ARM64=$(find app/build/outputs/apk/arm64 -name '*.apk' | head -1)
          ARM32=$(find app/build/outputs/apk/arm32 -name '*.apk' | head -1)
          test -s "$ARM64" && test -s "$ARM32"
          cp "$ARM64" out/vox-arm64-foss.apk
          cp "$ARM32" out/vox-arm32-foss.apk
          ls -lh out

      # A build that silently lost its signingConfig produced an unsigned APK that
      # Android refuses to install ("package appears to be invalid"). Verify every
      # artifact here so that failure can never reach a release again.
      - name: Verify test APK signatures
        if: env.IS_RELEASE != 'true'
        run: |
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          for apk in out/*.apk; do
            echo "== $apk"
            "$BT/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.log
            grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/apksigner.log \
              || { echo "$apk has no v1 signature" >&2; exit 1; }
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.log \
              || { echo "$apk has no v2 signature" >&2; exit 1; }
            "$BT/zipalign" -c -v 4 "$apk" > /dev/null
            "$BT/aapt2" dump badging "$apk" | grep -q "package: name='com.vox.music'" \
              || { echo "$apk has no valid package manifest" >&2; exit 1; }
          done

      - name: Upload test APKs
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ env.TAG }}-test-apks
          path: out/*.apk
          retention-days: 14

      - name: Stage release assets and manifest
        if: env.IS_RELEASE == 'true'
        env:
          UPDATER_IMAGE_URL: ${{ vars.UPDATER_IMAGE_URL }}
        run: |
          VERSION=$(sed -n 's/^VERSION_MAJOR=//p' version.properties).$(sed -n 's/^VERSION_MINOR=//p' version.properties).$(sed -n 's/^VERSION_PATCH=//p' version.properties)
          test "${TAG}" = "$VERSION" || { echo "Tag $TAG does not match version.properties $VERSION" >&2; exit 1; }
          VERSION_CODE=$(python3 -c 'import sys; a,b,c=(int(v) for v in sys.argv[1].split(".")); print((a*10000+b*100+c)*10000+9999)' "$VERSION")
          APK=$(find app/build/outputs/apk/universal -name '*.apk' | head -1)
          test -s "$APK" || { echo "No universal APK produced" >&2; exit 1; }
          cp "$APK" vox-universal-foss.apk
          cp "$APK" "vox-${TAG}.apk"
          IMAGE_ARGS=()
          if [ -n "${UPDATER_IMAGE_URL:-}" ]; then IMAGE_ARGS+=(--image "$UPDATER_IMAGE_URL"); fi
          python3 tools/publish_updater_metadata.py \
            --version "$VERSION" \
            --version-code "$VERSION_CODE" \
            --release-notes ".github/release-notes/${TAG}.md" \
            --output updater.json \
            "${IMAGE_ARGS[@]}" vox-universal-foss.apk
          ls -lh vox-universal-foss.apk "vox-${TAG}.apk" updater.json

      - name: Verify release APK signature
        if: env.IS_RELEASE == 'true'
        run: |
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs vox-universal-foss.apk | tee /tmp/apksigner.log
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/apksigner.log \
            || { echo "Universal APK has no v1 signature" >&2; exit 1; }
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.log \
            || { echo "Universal APK has no v2 signature" >&2; exit 1; }
          "$BT/zipalign" -c -v 4 vox-universal-foss.apk > /dev/null

      - name: Create release with notes
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/${TAG}.md"
          test -f "$NOTES" || { echo "Missing $NOTES" >&2; exit 1; }
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" --latest --repo "${{ github.repository }}"
          else
            gh release create "$TAG" --title "Vox $TAG" --notes-file "$NOTES" --latest \
              --repo "${{ github.repository }}"
          fi

      - name: Upload release APKs
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No updater.json in the assets: the manifest lives in the repository.
          gh release upload "$TAG" vox-universal-foss.apk "vox-${TAG}.apk" \
            --repo "${{ github.repository }}" --clobber

      - name: Publish updater manifest to main
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp updater.json /tmp/vox-updater.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp /tmp/vox-updater.json updater.json
          if git diff --quiet -- updater.json; then
            echo "Manifest unchanged."
          else
            git add updater.json
            git commit -m "Publish updater manifest for $TAG"
            git push origin main
          fi
